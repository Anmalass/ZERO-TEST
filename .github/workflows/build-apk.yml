name: Build Godot APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - name: Android SDK components
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.10.2.4988404" "ndk;23.2.8568313" > /dev/null
      - name: Debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 9999 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12
      - name: Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          for v in 4 4.3; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_HOME" "$GITHUB_WORKSPACE/debug.keystore" > ~/.config/godot/editor_settings-$v.tres
          done
          ls ~/.config/godot
      - name: Ensure export templates
        run: |
          T=~/.local/share/godot/export_templates/4.3.stable
          if [ ! -f "$T/android_debug.apk" ]; then
            mkdir -p "$T"
            curl -sL -o t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q t.tpz -d tpl
            cp -r tpl/templates/* "$T/"
          fi
          ls "$T" | head -30
      - name: Import project
        run: godot --headless --path . --import || true
      - name: Export APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/project-zero.apk 2>&1 | tail -80
      - name: Diagnostics
        if: failure()
        run: |
          echo "JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/build-tools $ANDROID_HOME/platforms $ANDROID_HOME/ndk $ANDROID_HOME/cmdline-tools || true
          grep android ~/.config/godot/editor_settings-4.3.tres || true
          ls ~/.local/share/godot/export_templates/* | head -20
          cat export_presets.cfg
      - uses: actions/upload-artifact@v4
        with:
          name: project-zero-debug-apk
          path: build/project-zero.apk
          
